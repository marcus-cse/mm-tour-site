<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marcus Maldonado — Guitarist</title>
  <meta property="og:title" content="Marcus Maldonado — Guitarist" />
  <meta property="og:description" content="Soulful, professional guitar performances for artists, weddings, and luxury experiences." />
  <meta property="og:image" content="https://marcus.band/assets/img/mm-backdrop.jpg" />
  <meta property="og:url" content="https://marcus.band" />
  <meta property="og:type" content="website" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Marcus Maldonado",
    "alternateName": "@musicianmarcus",
    "url": "https://marcus.band",
    "image": "https://marcus.band/assets/img/mm-backdrop.jpg",
    "jobTitle": "Guitarist",
    "description": "Dallas-based guitarist. Soulful, professional guitar performances for artists, weddings, and luxury experiences. Not to be confused with the recording artist of the same name on Apple Music and Spotify.",
    "disambiguatingDescription": "Dallas, Texas guitarist and engineer. Live performance, sideman work, and private events. Distinct from the recording artist at music.apple.com/us/artist/marcus-maldonado/1556543901 and open.spotify.com/artist/6EZ66zV2op8yaMImJdbkw3, who is a different person of the same name.",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Dallas",
      "addressRegion": "TX",
      "addressCountry": "US"
    },
    "sameAs": [
      "https://www.instagram.com/musicianmarcus"
    ]
  }
  </script>
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />
  <link rel="preload" as="image" href="assets/img/mm-backdrop.jpg" fetchpriority="high" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    #mm-preloader {
      position: fixed; inset: 0;
      background: #F4F2EE;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      transition: opacity 0.4s ease-out;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #mm-preloader.is-done { opacity: 0; pointer-events: none; }
    .mm-preloader-mark {
      font-family: "Anton", "Bebas Neue", sans-serif;
      font-size: 48px;
      letter-spacing: -0.02em;
      color: #0A0A0A;
      line-height: 1;
      opacity: 0;
      transition: opacity 0.3s ease-in;
    }
    #mm-preloader.font-ready .mm-preloader-mark { opacity: 1; }
    .mm-preloader-bar {
      width: 60px; height: 2px;
      background: #C8A96E;
      transform-origin: left center;
      animation: mm-preloader-bar 1.4s ease-in-out infinite;
    }
    @keyframes mm-preloader-bar {
      0%     { transform: scaleX(0); }
      50%    { transform: scaleX(1); }
      50.01% { transform-origin: right center; }
      100%   { transform: scaleX(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .mm-preloader-bar { animation: mm-preloader-bar-fade 1.4s ease-in-out infinite; }
      @keyframes mm-preloader-bar-fade {
        0%, 100% { opacity: 0.3; }
        50%     { opacity: 1; }
      }
    }
  </style>
  <script src="assets/js/head.js"></script>
  <style>
    html, body { height: 100%; overflow: hidden; }
    .gl-root.gl-home-only { height: 100%; display: flex; flex-direction: column; }
    .gl-hero.gl-hero--full { flex: 1; min-height: 0; }
    .gl-hero-now-val, .gl-hero-now-sub { transition: opacity 0.4s; }
    .gl-home-strip {
      background: var(--bg);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 48px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--fg);
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div id="mm-preloader" aria-hidden="true">
    <div class="mm-preloader-mark">MM</div>
    <div class="mm-preloader-bar"></div>
  </div>

  <div class="gl-root gl-home-only">
    <section class="gl-hero gl-hero--full">

      <!-- Background photo + scrim -->
      <div class="gl-hero-image">
        <img src="assets/img/mm-backdrop.jpg" alt="Marcus Maldonado on stage" class="gl-hero-img" fetchpriority="high" decoding="sync" />
        <div class="gl-hero-scrim"></div>
      </div>

      <!-- Nav -->
      <header class="gl-nav">
        <a href="./" class="gl-mark">MM</a>
        <nav>
          <a href="./" class="is-current">Home</a>
          <a href="tour/">Tour</a>
          <a href="map/">Map</a>
          <a href="about/">About</a>
        </nav>
        <a href="booking/" class="gl-nav-cta">Inquire</a>
        <button class="gl-nav-toggle" id="nav-toggle" aria-label="Open menu">
          <span></span><span></span><span></span>
        </button>
      </header>

      <!-- Mobile nav overlay -->
      <div class="gl-nav-overlay" id="nav-overlay">
        <button class="gl-nav-overlay-close" id="nav-close" aria-label="Close menu">✕</button>
        <a href="./" class="is-current">Home</a>
        <a href="tour/">Tour</a>
        <a href="map/">Map</a>
        <a href="about/">About</a>
        <a href="booking/" class="gl-nav-overlay-cta">Inquire</a>
      </div>

      <!-- Hero text -->
      <div class="gl-hero-text">
        <div class="gl-hero-eyebrow">
          <span>GUITARIST · CREATIVE ENTREPRENEUR</span>
        </div>
        <h1 class="gl-hero-title"><span style="display:block;margin-bottom:0.12em">MARCUS</span>MALDONADO</h1>
        <p class="gl-hero-tag-line">
          Soulful, professional guitar performances<br>
          for artists, weddings, and luxury experiences.
        </p>
      </div>

      <!-- Footer strip -->
      <div class="gl-hero-foot">
        <div class="gl-hero-foot-l">
          <a href="tour/" class="gl-hero-link">
            <span class="gl-hero-link-num">01</span>
            <span>VIEW TOUR DATES</span>
            <span>→</span>
          </a>
          <a href="booking/" class="gl-hero-link">
            <span class="gl-hero-link-num">02</span>
            <span>BOOK A DATE</span>
            <span>→</span>
          </a>
        </div>
        <div class="gl-hero-now">
          <div class="gl-hero-now-label">NEXT SHOW</div>
          <div class="gl-hero-now-val" id="next-show-val">—</div>
          <div class="gl-hero-now-sub" id="next-show-sub" style="font-size:12px;opacity:0.7;margin-top:4px;">Loading…</div>
        </div>
      </div>

    </section>

    <div class="gl-home-strip">
      <span>© <span id="home-year"></span> MARCUS MALDONADO</span>
      <span>BUILT IN TEXAS</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/sheet.js"></script>
  <script>
    document.getElementById('home-year').textContent = new Date().getFullYear();

    MM.Shows.fetch()
      .then(shows => {
        const next = shows[0];
        if (next) {
          document.getElementById('next-show-val').textContent =
            `${MM.Shows.fmt.month(next.date)} ${MM.Shows.fmt.day(next.date)} · ${next.artist}`;
          document.getElementById('next-show-sub').textContent =
            next.status === 'private' ? 'Private engagement' : `${next.venue} — ${next.city}`;
        } else {
          document.getElementById('next-show-val').textContent = 'TBA';
          document.getElementById('next-show-sub').textContent = 'Stay tuned';
        }
      })
      .catch(() => {
        document.getElementById('next-show-sub').textContent = '';
      });
  </script>

  <script>
    (function() {
      const el = document.getElementById('mm-preloader');
      if (!el) return;
      if (document.fonts && document.fonts.load) {
        document.fonts.load('400 48px Anton').finally(() => el.classList.add('font-ready'));
      } else {
        el.classList.add('font-ready');
      }
      let done = false;
      const reveal = () => {
        if (done) return;
        done = true;
        el.classList.add('is-done');
        setTimeout(() => el.remove(), 500);
      };
      if (document.readyState === 'complete') { reveal(); return; }
      window.addEventListener('load', reveal, { once: true });
      setTimeout(reveal, 4000); // hard cap in case a CDN hangs
    })();
  </script>
</body>
</html>
