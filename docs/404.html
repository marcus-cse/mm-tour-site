<!DOCTYPE html>
<!-- SPDX-License-Identifier: MIT · © 2026 Marcus Maldonado · https://marcus.band -->
<!-- GitHub Pages serves this for any missing path, so every URL here is root-absolute -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page Not Found — Marcus Maldonado</title>
  <link rel="icon" href="/assets/img/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/img/favicon-48.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/img/favicon-192.png" />
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png" />
  <script src="/assets/js/head.js"></script>
  <style>
    html, body { height: 100%; }
    .gl-root.gl-page { min-height: 100%; display: flex; flex-direction: column; }
    .gl-nav--page { position: relative; flex-shrink: 0; }

    .nf {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 48px 24px 96px;
      text-align: center;
    }
    .nf-code {
      font-family: var(--display);
      font-size: clamp(140px, 30vw, 360px);
      line-height: 0.85;
      letter-spacing: -0.02em;
      margin: 0;
      font-weight: 400;
      -webkit-text-stroke: 1.5px var(--fg);
      -webkit-text-fill-color: transparent;
    }
    .nf-line { font-size: 17px; color: var(--fg-2); margin: 0; }
    .nf-home {
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 1px solid var(--fg);
      border-radius: 999px;
      padding: 14px 28px;
      transition: background 0.15s, color 0.15s;
    }
    .nf-home:hover { background: var(--fg); color: var(--bg); }
  </style>
</head>
<body>
  <div class="gl-root gl-page">

    <!-- Nav -->
    <header class="gl-nav gl-nav--page">
      <a href="/" class="gl-mark">MM</a>
      <nav>
        <a href="/">Home</a>
        <a href="/tour/">Tour</a>
        <a href="/map/">Map</a>
        <a href="/about/">About</a>
      </nav>
      <a href="/booking/" class="gl-nav-cta">Inquire</a>
      <button class="gl-nav-toggle" id="nav-toggle" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
    </header>
    <div class="gl-nav-overlay" id="nav-overlay">
      <button class="gl-nav-overlay-close" id="nav-close" aria-label="Close menu">✕</button>
      <a href="/">Home</a>
      <a href="/tour/">Tour</a>
      <a href="/map/">Map</a>
      <a href="/about/">About</a>
      <a href="/booking/" class="gl-nav-overlay-cta">Inquire</a>
    </div>

    <main class="nf">
      <h1 class="nf-code">404</h1>
      <p class="nf-line">This page isn't on the tour.</p>
      <a href="/" class="nf-home">Back home</a>
    </main>

  </div>
  <script src="/assets/js/nav.js"></script>
</body>
</html>
